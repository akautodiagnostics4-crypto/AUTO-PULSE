name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install @tailwindcss/vite tailwindcss
      - run: npm run build
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init AutoPulse com.pollachi.autopulse --web-dir=dist
      - run: npx cap add android
      - run: npx cap copy
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pollachi-AutoPulse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
