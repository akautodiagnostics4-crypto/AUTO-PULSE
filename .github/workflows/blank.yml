name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Navigate into project folder and generate missing Gradle wrapper
        run: |
          cd AUTO-PULSE-main
          
          # Create root settings.gradle if missing
          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
          fi
          
          # Create root build.gradle if missing
          if [ ! -f build.gradle ]; then
            echo "buildscript { repositories { google() mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0' } }" > build.gradle
          fi

          # Generate the gradle wrapper so gradlew exists
          gradle wrapper --gradle-version 8.5
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: AUTO-PULSE-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
