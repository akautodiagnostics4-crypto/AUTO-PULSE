name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK with Platform 34
        uses: android-actions/setup-android@v4
        with:
          items: platforms;android-34,build-tools;34.0.0
          license-accepted: true

      - name: Scaffold Project and Build with Error Logging
        run: |
          # Print environment diagnostics
          echo "Java Home: $JAVA_HOME"
          java -version
          echo "Android Home: $ANDROID_HOME"

          # Create a clean working workspace directory for the build
          mkdir -p workspace/app/src/main/java/com/example/autopulse
          mkdir -p workspace/app/src/main/res/values
          cd workspace

          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTO-PULSE"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 3. App-level build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="AUTO PULSE"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AUTO PULSE</string>
          </resources>
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/autopulse/MainActivity.kt
          package com.example.autopulse

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          # 7. Local properties mapping the SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 8. Download Gradle 8.5 binary directly
          echo "Downloading Gradle 8.5 binary..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          # 9. Execute build and capture log output
          echo "Executing Gradle build..."
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
              echo "=================================================="
              echo "BUILD FAILED. PRINTING FULL GRADLE ERROR LOG:"
              echo "=================================================="
              cat build_output.log
              exit 1
          else
              echo "Build succeeded successfully!"
          fi

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
