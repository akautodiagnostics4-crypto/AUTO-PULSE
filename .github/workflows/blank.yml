name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # CHANGE THIS to the actual folder name where build.gradle lives (e.g., ./AUTO-PULSE-main)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./AUTO-PULSE-main  # <--- Update this folder name

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./AUTO-PULSE-main  # <--- Update this folder name

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: AUTO-PULSE-main/app/build/outputs/apk/debug/app-debug.apk
