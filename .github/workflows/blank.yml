name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK with Platform 34
        uses: android-actions/setup-android@v4
        with:
          items: platforms;android-34,build-tools;34.0.0
          license-accepted: true

      - name: Configure, Build, and Print Output on Failure
        run: |
          echo "Searching for project directory..."
          
          if [ -d "app" ]; then
            PROJECT_DIR="."
          elif [ -d "AUTO-PULSE-main/app" ]; then
            PROJECT_DIR="AUTO-PULSE-main"
          else
            PROJECT_DIR=$(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
          fi
          
          echo "Target project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 1. Create root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTO-PULSE"
          include ':app'
          EOF
          
          # 2. Create root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 3. Create app/build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 4. Ensure AndroidManifest.xml exists
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="AUTO PULSE"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Ensure required strings.xml exists
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AUTO PULSE</string>
          </resources>
          EOF

          # 6. Ensure MainActivity exists
          mkdir -p app/src/main/java/com/example/autopulse
          cat << 'EOF' > app/src/main/java/com/example/autopulse/MainActivity.kt
          package com.example.autopulse

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          # 7. Link Android SDK location
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 8. Download and use Gradle 8.5 binary directly
          echo "Downloading Gradle 8.5 binary..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          export JAVA_HOME=$JAVA_HOME
          echo "Running Gradle build..."
          
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace || {
              echo "=== BUILD FAILED ==="
              exit 1
          }

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
